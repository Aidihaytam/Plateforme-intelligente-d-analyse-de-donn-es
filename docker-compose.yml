services:
  database:
    image: postgres:17
    container_name: intelligent_analysis_db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: intelligent_analysis_backend
    restart: unless-stopped
    working_dir: /var/www/html

    volumes:
      - ./backend:/var/www/html

    environment:
      APP_ENV: dev
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}?serverVersion=17&charset=utf8"

    ports:
      - "8000:8000"

    depends_on:
      database:
        condition: service_healthy

    command: php -S 0.0.0.0:8000 -t public public/index.php

volumes:
  postgres_data:
